name: org.version
run-name: org.version ${{ inputs.version }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'set version for build'
        type: string
        required: true

jobs:
  # ╔═════════════════════════════════════════════════════╗
  # ║               BUILD VERSION {N} IMAGE               ║
  # ╚═════════════════════════════════════════════════════╝
  version:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 'master'

      - name: set build parameters
        uses: 11notes/actions/version@v1 # v1
        with:
          version: ${{ github.event.inputs.version }}

      - name: build container image
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 #v1.3.2
        with:
          wait-for-completion: false
          workflow: org.container.yml
          token: "${{ secrets.REPOSITORY_TOKEN }}"
          inputs: '{ "release":"false", "readme":"false", "run-name":"org.container build ${{ github.event.inputs.version }}", "etc":"${{ env.ACTIONS_VERSION_BASE64JSON }}" }'